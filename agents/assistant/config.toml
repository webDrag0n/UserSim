# ============================================================
# 助手 demo agent 配置（独立于 usersim；密钥仍在 config/llm.toml 或环境变量）
#
# 可供选择的 assistant 实现 = profiles/*.toml 的文件清单：
# 新增一个实现 = 放一个 <name>.toml（type: package | cli）；
# 删除文件即下线该实现。选择方式：--harness <name> 或下方的 default。
# type=package 的实现还需在同名文件夹提供 Python 包（暴露 create(client)）。
# ============================================================

default = "openclaw"        # 默认实现（profiles/ 下的文件名）

[llm]
provider = "deepseek"       # 引用 config/llm.toml [providers.*]（base_url/api_key 来源）
model = "deepseek-v4-flash"  # 固定版本：别名 deepseek-chat 会被供应商静默换血；pro 对照走 profiles 覆盖
# temperature = 0.7         # 可选覆盖
# max_tokens = 4096         # 可选覆盖
# 注：各实现可在自己的 toml 里写 [llm] 覆盖以上绑定（如给 reference 单独换模型）
