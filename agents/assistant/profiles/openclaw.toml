# 本机 OpenClaw agent 整机接入（E3：模型/记忆/工具习惯全部来自 CLI 自己）
# type = cli → usersim/agents/cli_agent.py 的通用 CLI 驱动
#
# argv 占位符：{message}=本轮消息 {timeout}=超时秒 {session}=会话凭据 {uid}=实例随机串
# 会话模式 key：每轮都带固定 session-key（{uid} 每实例渲染一次，snapshot/restore 保持一致），
# 不与用户的默认主会话混用。
type = "cli"
prompt_version = "v3"       # CLI 整机接入：prompt 由 CLI 自己管；v3=每轮加发动态恢复目录（cli_agent v3）
description = "本机 OpenClaw agent 整机接入（原生 session 记忆）"

[cli]
command = "openclaw"        # PATH 内或绝对路径
timeout_sec = 110           # 单轮上限；略低于 system.toml [agent_api] response_timeout_sec(120)
argv = [
  "agent", "--agent", "main",
  "--session-key", "{session}",
  "--json", "--thinking", "off",
  "--timeout", "{timeout}",
  "-m", "{message}",
]

[cli.session]
mode = "key"
key = "agent:main:usersim-{uid}"

[cli.output]
format = "json"             # openclaw agent --json 的信封
text_path = "result.payloads.*.text"   # * 展开列表，逐条 text 拼接
status_path = "status"
status_ok = "ok"
