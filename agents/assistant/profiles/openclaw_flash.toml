# 本机 OpenClaw agent 整机接入 · deepseek-v4-flash 变体
# 与 openclaw.toml 的差异仅 --model；session/输出解析约定相同。
type = "cli"
prompt_version = "v3"
description = "本机 OpenClaw agent（deepseek-v4-flash）"

[cli]
command = "openclaw"
timeout_sec = 110
argv = [
  "agent", "--agent", "main",
  "--session-key", "{session}",
  "--json", "--thinking", "off",
  "--timeout", "{timeout}",
  "--model", "deepseek/deepseek-v4-flash",
  "-m", "{message}",
]

[cli.session]
mode = "key"
key = "agent:main:usersim-{uid}"

[cli.output]
format = "json"
text_path = "result.payloads.*.text"
status_path = "status"
status_ok = "ok"
