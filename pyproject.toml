[project]
name = "usersim"
version = "0.1.0"
description = "长程用户-手机助手模拟与控制论 Benchmark 系统"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
markers = [
    "slow: 慢测试（批量回放/量程守护）。默认跳过，用 -m slow 单独跑，或 -m '' 全跑。",
]
addopts = "-m 'not slow'"
