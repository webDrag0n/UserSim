# ============================================================
# UserSim · 系统参数配置
# 本文件回答：世界怎么运转、轨迹怎么生成、指标怎么算、服务怎么起。
# 所有参数都有代码内默认值，本文件只写需要覆盖的项；
# 注释掉的条目展示可调项及其默认值。
# ============================================================

# ------------------------------------------------------------
# 运行：一次 benchmark 跑多久、结果放哪
# ------------------------------------------------------------
[run]
seed        = 42            # 全局种子：角色卡、事件流、扰动流全部由它派生
days        = 30            # 单个 episode 天数（评估窗口长度）
episodes    = 1             # 一次运行多少个 episode（逐 seed 递增）
out_dir     = "runs"        # 轨迹与报告输出目录（append-only JSONL）

# ------------------------------------------------------------
# 时钟：双层时间模型（事件间离散快进，session 内逐 turn）
# ------------------------------------------------------------
[clock]
slots_per_day         = 4
slot_names            = ["上午", "下午", "晚上", "深夜"]
max_sessions_per_slot = 5     # 每时段 session 容量上限（合法性校验用）

# ------------------------------------------------------------
# 状态向量与设定点（内心平和带）
# ------------------------------------------------------------
[state]
# 维度顺序固定；good = high 表示越高越好（低于目标才算误差），low 反之
dims    = ["valence", "energy", "satiety", "stress"]
targets = { valence = 0.72, energy = 0.70, satiety = 0.65, stress = 0.30 }
band    = 0.10              # 平和带半宽（单侧误差容忍度）
initial = { valence = 0.70, energy = 0.75, satiety = 0.60, stress = 0.28 }

# ------------------------------------------------------------
# 状态动力学：x(t+1) = 自然漂移 + 事件效果 + 控制回血（全部纯规则）
# ------------------------------------------------------------
[dynamics]
satiety_drain_per_slot   = 0.06    # 每时段饱腹自然消耗（新陈代谢；v5 从 0.075 下调——日内摆幅压缩）
work_stress_per_slot     = 0.035   # 工作日工作时段压力增速（v5 从 0.040 下调：原值下工作周净累积 +0.04/天，周五必出带）
work_energy_drain        = 0.04    # 工作日工作时段精力消耗（v5 从 0.06 下调：配睡眠 pull[0.80,0.70]，模板工作日精力周期 0.63-0.75 全在带内）
rest_stress_relief       = 0.020   # 休息时段压力自然回落（v5 从 0.015 上调：与 0.035×2 + 睡眠 -0.05 配平，工作周零净累积）
stress_mean_reversion    = 0.03    # 压力向 0.32 的自然心理调适速率（每时段）
stress_reversion_target  = 0.32
rebound_threshold        = 0.12    # 压力被压到此值以下 → 积压工作反弹
rebound_multiplier       = 2.0     # 反弹时压力增速/精力消耗倍率
valence_coupling_rate    = 0.25    # 心情向准稳态 v_eq 的漂移速率
# 注：进餐恢复与睡眠恢复已移入事件配表（catalog.MEAL_TIERS / SLEEP_TIERS）

# ------------------------------------------------------------
# 事件引擎：日程模板 ⊕ 泊松扰动 ⊕ 用户新增恢复事件
# ------------------------------------------------------------
[events]
disturbance_prob_per_day = 0.62    # 每天出现随机扰动的概率
disturbance_types        = ["临时加班", "应酬饭局", "暴雨行程受阻", "项目截止压缩", "朋友临时邀约"]
weekend_free_days        = [5, 6]  # 一周中不工作的日序号（0=周一）

# ------------------------------------------------------------
# 用户模拟 Agent 行为参数（LLM 之外的部分仍是规则）
# ------------------------------------------------------------
[user_agent]
help_seek_stress_threshold = 0.55  # 压力超过此值时 prompt 中强化求助倾向
max_turns_per_session      = 20    # 单次 session 对话轮数上限（超时强制结算）
# 事件驱动需求的概率触发（世界噪声流）：系列游玩 / 饭点 / 空闲闲聊
scene_probs = { series_activity = 0.6, meal = 0.12, idle = 0.08 }

# ------------------------------------------------------------
# 经济系统：工作进账 / 消费回血 / 负债压力
# ------------------------------------------------------------
[economy]
initial_money        = 1000   # 初始金钱
work_income_per_slot = 200    # 工作日每个工作时段收入
overtime_income      = 150    # 临时加班额外收入
debt_stress_per_slot = 0.02   # 金钱为负时每时段压力惩罚

# ------------------------------------------------------------
# 评估器：控制论指标与判定阈值
# ------------------------------------------------------------
[eval]
window_days        = 10     # 滑动结算窗口（每 W 天输出一次窗口指标序列）
tail_slots_for_ess = 12     # 稳态误差取末端多少个时段
settle_window_days   = 3      # 调节时间：滑窗长度（天）——v5 起改窗口驻留判定
settle_in_band_ratio = 0.70   # 滑窗内 in_band 占比 ≥ 此值即视为已稳定（替代旧"连续 8 时段全在带"：日内正常摆幅会永久打断连续判定）
converged_ess_max      = 0.060    # v4.1 按 20 个干净 live episode 终标定：好锚点 5-seed ess 均值 0.0548（sd 0.028），取均值+微裕度；v4 的 0.050 系按首批 15 episode P75 拟合，新种子落入右尾后 margin_good 再度转负（-0.005，≈0.4 SEM 的刀沿）——终值 0.060 = 好锚点均值 +0.005 余量
converged_settle_max   = 5.0    # 天（R4 起按 live reference 实测校准：收敛 run settle≈4.5；旧值 2.5 是 replay 脚本口径）
converged_overshoot_max = 0.20  # R4 起按 live reference 实测校准（收敛 run overshoot≈0.18；旧值 0.15 同上过严）
diverged_ess_min       = 0.080
# 注：原 diverged_slope_min 已删除——发散判定改用"后 10 天窗口均值对比"
# （比端点斜率抗振荡噪声），见 metrics._verdict 与 docs/04 第 3 节。

# ------------------------------------------------------------
# 健康分：扣分项权重 = [系数, 扣分上限]，扣分 = min(上限, 观测量 × 系数)
# 依据见 docs/04-evaluator.md 第 7 节；改这里即改主 KPI，请连带更新文档。
# ------------------------------------------------------------
[score]
ess         = [200.0, 40.0]   # 稳态误差：最重（控制目标本身）
violations  = [5.0, 15.0]     # 契约违约率（每百助手 turn；v4 起按话务量归一）
xhat_bias   = [80.0, 10.0]    # 估计系统性偏差
user_dup    = [1.5, 10.0]     # 台词复读（拟人性）
clamp_ratio = [80.0, 10.0]    # 状态饱和（世界分辨力）
no_recover  = [2.0, 10.0]     # 扰动无响应
persona_err = [40.0, 10.0]    # 画像精度：人格/喜好估计偏差（0.25 偏差即扣满）
# 行为一致性（用户 Agent 作为 reward 信号的可信度）
pac_conflict    = [25.0, 12.0]  # 偏好-行动冲突率
wsc_incoherent  = [15.0, 8.0]   # 会话内情感不一致比例
pra_misaligned  = [10.0, 5.0]   # 喜好-请求不对齐比例

# ------------------------------------------------------------
# Benchmark 分数：被测 assistant 的存档综合分（report.json benchmark 字段）
# 与 [score] 同构：[系数, 扣分上限]，扣分 = min(上限, 观测量 × 系数)，
# B = max(0, 100 − Σ 扣分)。观测量全部"越大越差"，缺失按满误差/满封顶计。
# 设计理由见 docs/04-evaluator.md 第 8 节；改这里即改主 KPI，请连带更新文档。
# ------------------------------------------------------------
[benchmark]
# —— 控制表现（report 控制回路指标，权重主体）——
ess             = [200.0, 30.0]  # 稳态误差：控制目标本身，最重
settle_frac     = [12.0, 10.0]   # 未稳定时间占比（未稳定=1.0 直接近封顶）
overshoot       = [40.0, 8.0]    # 超调量
iae_daily       = [100.0, 10.0]  # 日均误差总量（IAE/天数 ≈ mean|e|）
variance        = [100.0, 6.0]   # 状态方差
band_deficit    = [16.0, 8.0]    # 带外时间占比 1−ρ
# —— 状态估计与画像（第二公理：理解用户）——
est_err         = [40.0, 8.0]    # 状态估计终值误差
est_slope       = [1000.0, 4.0]  # 估计误差正斜率（越聊越差）
persona_err     = [40.0, 8.0]    # 画像误差
coverage_deficit = [8.0, 4.0]    # 画像覆盖缺口
prefs_err       = [20.0, 4.0]    # 喜好数值误差
f1_deficit      = [6.0, 3.0]     # 爱憎命中缺口 1−F1
# —— 契约与仿真有效性（门槛项，不是主体分）——
# v3：user_dup / clamp_ratio / wsc_incoherent 已移出 benchmark（归因混杂——
# 分别度量用户 LLM 台词多样性/世界饱和分辨力/用户情感摆荡，归 health_score
# 诊断仿真健康；此处保留键位不会有效果，列出仅为历史注释）
violations      = [5.0, 15.0]    # 契约违约率（每百助手 turn；v4 起归一）
no_recover      = [2.0, 6.0]     # 扰动无响应
pac_conflict    = [25.0, 6.0]    # 偏好-行动冲突率
pra_misaligned  = [10.0, 3.0]    # 喜好-请求不对齐

# ------------------------------------------------------------
# Agent 接入接口（demo 回环与外部 agent 共用，docs/15-agent-api.md）
# ------------------------------------------------------------
[agent_api]
response_timeout_sec = 120   # runner 等待 agent 响应的上限（超时：用户侧记降级、助手侧记契约违约）
poll_timeout_sec     = 30    # agent 长轮询 /api/agent/pending 的持有时间（无请求返回 204）

# ------------------------------------------------------------
# 服务与前端
# ------------------------------------------------------------
[server]
host = "127.0.0.1"
port = 8610                 # FastAPI 后端；前端 dev server 代理到此端口

[frontend]
dev_port = 7100
build_dir = "web/dist"      # 生产模式由后端直接托管
